<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIX 디지털 출판 실무 · 16차시 커리큘럼</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
  font-weight: 45 920;
}

:root{
  --bg:#FAF5EE;
  --card:#FDF8F2;
  --ink:#241C19;
  --muted:#6E6259;
  --line:#E9DDCE;
  --maroon:#7C2340;
  --maroon-ink:#5A1830;
  --maroon-tint:#F3DDE3;
  --gold:#B9862A;
  --gold-ink:#8C6720;
  --gold-tint:#F5E7C6;
}

*{ box-sizing:border-box; }

html, body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Deck / Slides ---------- */
.deck{
  position:relative;
  height:100vh;
  width:100vw;
}
.slide{
  position:absolute;
  inset:0;
  opacity:0;
  visibility:hidden;
  transform:translateX(24px);
  transition:opacity .32s ease, transform .32s ease;
  display:flex;
  flex-direction:column;
  padding:56px 64px 100px;
}
.slide.active{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
}
.slide.prev-out{ transform:translateX(-24px); }
.slide-inner{
  flex:1;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

/* ---------- Title slide ---------- */
.slide.title-slide .slide-inner{
  justify-content:center;
  max-width:760px;
  margin:0 auto;
  text-align:left;
}
.eyebrow-tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--maroon-tint);
  color:var(--maroon-ink);
  font-weight:700;
  font-size:0.82rem;
  padding:6px 14px;
  border-radius:999px;
  width:fit-content;
  margin-bottom:20px;
}
.title-slide h1{
  font-size:clamp(2.1rem, 4.4vw, 3rem);
  font-weight:800;
  letter-spacing:-0.01em;
  margin:0 0 16px;
}
.title-slide p.lead{
  color:var(--muted);
  font-size:1.05rem;
  max-width:560px;
  margin:0 0 32px;
}
.hero-meta{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:28px; }
.meta-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px 18px;
  min-width:140px;
}
.meta-card .num{ font-size:1.5rem; font-weight:800; }
.meta-card .label{ font-size:0.82rem; color:var(--muted); margin-top:2px; }
.day-split{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.split-chip{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:8px 16px 8px 10px; font-size:0.85rem;
}
.split-dot{ width:10px; height:10px; border-radius:50%; flex:none; }
.split-dot.a{ background:var(--maroon); }
.split-dot.b{ background:var(--gold); }
.split-plus{ color:var(--muted); font-size:0.85rem; }

/* ---------- Shared page head (non-phase intro slides) ---------- */
.page-head{
  display:flex;
  align-items:center;
  gap:14px;
  border-left:6px solid var(--maroon);
  padding-left:16px;
  margin-bottom:30px;
  flex:none;
}
.page-head h2{ font-size:1.55rem; font-weight:800; margin:0; }

.section-eyebrow{
  display:inline-block;
  font-weight:800;
  font-size:0.82rem;
  letter-spacing:0.02em;
  color:var(--maroon-ink);
  margin-bottom:14px;
}
.section-eyebrow::after{
  content:'';
  display:block;
  width:40px;
  height:3px;
  background:var(--gold);
  margin-top:9px;
  border-radius:2px;
}

.bullet-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px; }
.bullet-list li{ display:flex; gap:10px; align-items:flex-start; font-size:0.92rem; color:var(--ink); }
.bullet-list li .mark{ color:var(--gold); flex:none; margin-top:1px; font-weight:800; }

/* ---------- Cover slide ---------- */
.cover-slide .slide-inner{
  align-items:center;
  justify-content:center;
  text-align:center;
  max-width:640px;
  margin:0 auto;
}
.cover-eyebrow{
  display:flex; align-items:center; justify-content:center; gap:10px;
  color:var(--maroon-ink); font-weight:800; font-size:0.85rem; margin-bottom:22px;
}
.cover-eyebrow .sep{ color:var(--line); }
.cover-slide h1{
  font-size:clamp(2.3rem, 5vw, 3.3rem);
  font-weight:800;
  letter-spacing:-0.01em;
  margin:0 0 20px;
}
.cover-slide .sub{ color:var(--muted); font-size:1rem; line-height:1.7; margin:0 0 26px; }
.cover-rule{ width:64px; height:3px; background:var(--gold); margin:0 auto 22px; border-radius:2px; }
.cover-caption{ font-size:0.86rem; font-weight:700; color:var(--ink); }

/* ---------- Philosophy slide ---------- */
.philosophy-slide .slide-inner{ justify-content:center; }
.philo-grid{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:52px; align-items:center; }
@media (max-width: 900px){ .philo-grid{ grid-template-columns:1fr; } }
.philo-grid h2{ font-size:1.6rem; font-weight:800; line-height:1.45; margin:0 0 18px; }
.philo-grid h2 .accent{ display:block; color:var(--gold-ink); }
.philo-grid p{ color:var(--muted); font-size:0.94rem; line-height:1.7; margin:0; }
.philo-sub{ margin-top:30px; }
.philo-sub h3{ font-size:0.98rem; font-weight:800; color:var(--maroon-ink); margin:0 0 8px; }
.philo-sub p{ font-size:0.9rem; }
.philo-sub strong{ color:var(--ink); }

.philo-graphic{ display:flex; align-items:center; justify-content:center; gap:20px; flex-wrap:wrap; }
.philo-badge-wrap{
  position:relative; width:118px; height:118px; border:1.5px dashed var(--gold);
  border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;
}
.philo-badge{
  width:54px; height:54px; border-radius:14px; background:var(--maroon); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.05rem;
}
.philo-chips{ position:absolute; bottom:-14px; display:flex; gap:7px; }
.chip-icon{
  width:26px; height:26px; border-radius:8px; background:var(--card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--maroon-ink);
}
.chip-icon svg{ width:14px; height:14px; }
.philo-arrow{ color:var(--muted); flex:none; }
.philo-mock{
  width:180px; background:#fff; border:1px solid var(--line); border-radius:12px;
  padding:12px; box-shadow:0 10px 24px rgba(36,28,25,0.08); flex:none;
}
.philo-mock .bar{ height:6px; border-radius:3px; background:var(--line); margin-bottom:9px; }
.philo-mock .bar:last-of-type{ width:60%; }
.philo-mock .cols{ display:flex; gap:6px; margin-top:10px; }
.philo-mock .col{ flex:1; height:66px; border-radius:6px; background:var(--maroon-tint); }
.philo-mock .col.alt{ background:var(--gold-tint); }

/* ---------- System slide ---------- */
.system-body{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:44px; align-items:start; }
@media (max-width: 900px){ .system-body{ grid-template-columns:1fr; } }
.system-body h2{ font-size:1.4rem; font-weight:800; line-height:1.4; margin:0 0 16px; }
.system-body > div:first-child > p{ color:var(--muted); font-size:0.92rem; line-height:1.7; margin:0 0 20px; }

.process-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 22px 18px; }
.process-row{
  display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line);
  border-radius:10px; padding:12px 14px;
}
.process-row + .process-row{ margin-top:10px; }
.process-row .icon{
  width:30px; height:30px; border-radius:8px; background:var(--maroon-tint); color:var(--maroon-ink);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.process-row .icon svg{ width:16px; height:16px; }
.process-row span.label{ font-weight:700; font-size:0.9rem; }

/* ---------- AI thesis slide ---------- */
.ai-slide .slide-inner{ justify-content:center; }
.ai-slide h2{ font-size:1.6rem; font-weight:800; line-height:1.45; margin:0 0 14px; max-width:680px; }
.ai-slide > .slide-inner > p{ color:var(--muted); font-size:0.94rem; line-height:1.7; margin:0 0 30px; max-width:640px; }
.reason-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
@media (max-width: 900px){ .reason-grid{ grid-template-columns:1fr; } }
.reason-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px 24px; }
.reason-card .icon-circle{ width:46px; height:46px; margin-bottom:16px; }
.reason-card .icon-circle svg{ width:23px; height:23px; }
.reason-card h3{ font-size:1.02rem; font-weight:800; margin:0 0 10px; line-height:1.4; }
.reason-card p{ font-size:0.88rem; color:var(--muted); margin:0; line-height:1.65; }

/* ---------- Checklist slide ---------- */
.check-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
@media (max-width: 900px){ .check-grid{ grid-template-columns:1fr; } }
.check-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 24px 22px; }
.check-card h3{ font-size:1rem; font-weight:800; margin:0 0 16px; }
.pain-list{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
.pain-list li{ display:flex; gap:9px; align-items:flex-start; font-size:0.85rem; color:var(--ink); }
.pain-list li .mark{ width:6px; height:6px; border-radius:50%; background:var(--maroon); flex:none; margin-top:6px; }
.target-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
.target-list li{ display:flex; gap:9px; align-items:flex-start; font-size:0.87rem; color:var(--ink); line-height:1.55; }
.target-list li .mark{ width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none; margin-top:7px; }
.target-list li strong{ font-weight:700; }

/* ---------- Overview slide ---------- */
.overview-table{ width:100%; border-collapse:collapse; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.overview-table th{ background:#241C19; color:#fff; text-align:left; padding:14px 20px; font-size:0.84rem; font-weight:700; width:26%; }
.overview-table td{ padding:16px 20px; font-size:0.9rem; color:var(--ink); border-top:1px solid var(--line); line-height:1.6; }
.overview-table tbody tr:nth-child(even) td{ background:#F3ECE1; }
.overview-table td.label{ font-weight:700; }

/* ---------- Phase slide ---------- */
.phase-head{
  display:flex;
  align-items:baseline;
  gap:16px;
  border-left:6px solid var(--maroon);
  padding-left:18px;
  margin-bottom:28px;
  flex:none;
}
.phase-head h2{ font-size:1.5rem; font-weight:800; margin:0; }
.phase-head .range{ font-size:0.9rem; color:var(--muted); font-weight:600; white-space:nowrap; }

.day-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  align-content:start;
}
@media (max-width: 980px){ .day-grid{ grid-template-columns:repeat(2, 1fr); } }
@media (max-width: 640px){ .day-grid{ grid-template-columns:1fr; } .slide{ padding:40px 24px 110px; } }

.day-card{
  background:var(--card);
  border:1px solid var(--line);
  border-top:5px solid var(--maroon);
  border-radius:14px;
  padding:22px 20px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.day-card.gold{ border-top-color:var(--gold); }
.card-top{ display:flex; align-items:center; justify-content:space-between; }
.icon-circle{
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--maroon-tint); color:var(--maroon-ink); flex:none;
}
.day-card.gold .icon-circle{ background:var(--gold-tint); color:var(--gold-ink); }
.icon-circle svg{ width:21px; height:21px; }
.badge{
  font-size:0.76rem; font-weight:700; padding:5px 12px; border-radius:999px;
  background:var(--maroon-tint); color:var(--maroon-ink);
}
.day-card.gold .badge{ background:var(--gold-tint); color:var(--gold-ink); }
.day-title{ font-size:1rem; font-weight:700; margin:0; line-height:1.35; }
.day-desc{ font-size:0.87rem; color:var(--muted); margin:0; }

.toggle-btn{
  align-self:flex-start; background:none; border:none; padding:0;
  font-family:inherit; font-size:0.82rem; font-weight:700; color:var(--maroon-ink);
  cursor:pointer; display:flex; align-items:center; gap:6px; margin-top:auto;
}
.day-card.gold .toggle-btn{ color:var(--gold-ink); }
.toggle-btn .chev{ transition:transform .2s ease; display:inline-flex; }
.toggle-btn[aria-expanded="true"] .chev{ transform:rotate(180deg); }

.detail{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease; }
.detail > div{ overflow:hidden; }
.detail.open{ grid-template-rows:1fr; }
.detail-block{ padding-top:4px; }
.detail-block + .detail-block{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
.detail-block h4{ font-size:0.74rem; font-weight:800; margin:0 0 6px; }
.detail-block ul{ margin:0; padding-left:16px; font-size:0.82rem; color:var(--muted); display:flex; flex-direction:column; gap:5px; }
.time-tag{ display:inline-block; font-weight:700; color:var(--ink); margin-right:4px; }

.example-block{ margin-top:4px; }
.example-block h4{ font-size:0.74rem; font-weight:800; margin:0 0 8px; }
.example-block img{
  width:100%;
  border-radius:10px;
  border:1px solid var(--line);
  display:block;
  cursor:zoom-in;
}
.example-block .cap{ font-size:0.76rem; color:var(--muted); margin-top:6px; }

.carousel-viewport{ overflow:hidden; border-radius:10px; }
.carousel-track{ display:flex; transition:transform .3s ease; }
.carousel-slide{ flex:0 0 100%; min-width:0; }
.carousel-slide img{ margin:0; border-radius:10px; }
.carousel-nav{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:10px;
}
.carousel-btn{
  width:28px; height:28px; border-radius:50%;
  background:var(--card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink); flex:none; padding:0;
}
.carousel-btn:hover{ border-color:var(--maroon); }
.carousel-dots{ display:flex; gap:6px; }
.carousel-dots .cdot{
  width:6px; height:6px; border-radius:50%;
  background:var(--line); border:none; cursor:pointer; padding:0;
}
.carousel-dots .cdot.active{ background:var(--maroon); }
.day-card.gold .carousel-dots .cdot.active{ background:var(--gold); }

.lightbox{
  position:fixed; inset:0; z-index:999;
  background:rgba(24,18,16,0.9);
  display:none; align-items:center; justify-content:center;
  padding:40px;
}
.lightbox.open{ display:flex; }
.lightbox img{
  max-width:100%; max-height:100%;
  border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.lightbox-close{
  position:absolute; top:22px; right:26px;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3);
  color:#fff; font-size:1.1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- Notes slide ---------- */
.slide.notes-slide .slide-inner{
  justify-content:center;
  max-width:640px;
  margin:0 auto;
}
.note-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:32px 34px;
}
.note-card h2{ margin:0 0 16px; font-size:1.3rem; font-weight:800; }
.note-card ul{ margin:0; padding-left:18px; color:var(--muted); font-size:0.92rem; display:flex; flex-direction:column; gap:10px; }
.restart-btn{
  margin-top:26px;
  background:var(--maroon);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:11px 22px;
  font-size:0.9rem;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
}

/* ---------- Nav bar ---------- */
.deck-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:20px 24px 24px;
  background:linear-gradient(to top, var(--bg) 55%, transparent);
}
.nav-btn{
  width:42px; height:42px; border-radius:50%;
  background:var(--card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink); flex:none;
  transition:border-color .15s ease, opacity .15s ease;
}
.nav-btn:hover{ border-color:var(--maroon); }
.nav-btn:disabled{ opacity:0.35; cursor:default; }
.nav-btn:disabled:hover{ border-color:var(--line); }
.dots{ display:flex; gap:9px; align-items:center; }
.dot{
  width:9px; height:9px; border-radius:50%;
  background:var(--line); border:none; cursor:pointer; padding:0;
  transition:background .15s ease, transform .15s ease;
}
.dot.active{ background:var(--maroon); transform:scale(1.25); }
.slide-count{ font-size:0.8rem; color:var(--muted); font-weight:600; min-width:44px; text-align:center; }

@media (prefers-reduced-motion: reduce){
  .slide{ transition:none; }
  .detail, .toggle-btn .chev{ transition:none; }
}
</style>
</head>
<body>

<div class="deck" id="deck"></div>

<div class="deck-nav">
  <button class="nav-btn" id="prevBtn" aria-label="이전 슬라이드">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="dots" id="dots"></div>
  <span class="slide-count" id="slideCount">1 / 6</span>
  <button class="nav-btn" id="nextBtn" aria-label="다음 슬라이드">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<script>
const ICONS = {
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c0-1 .8-1.5 2-1.5h6v15H6c-1.2 0-2 .5-2 1.5V5.5Z"/><path d="M20 5.5c0-1-.8-1.5-2-1.5h-6v15h6c1.2 0 2 .5 2 1.5V5.5Z"/></svg>',
  layout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17"/><path d="M9 9.5V20"/></svg>',
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14"/><path d="M12 6.5V18"/><path d="M9 18h6"/></svg>',
  layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4 3.5 9 12 14l8.5-5L12 4Z"/><path d="m3.5 13 8.5 5 8.5-5"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 17 4.5-4.5 3 3 4-5 4.5 6.5"/></svg>',
  droplet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s6 6.7 6 10.8a6 6 0 0 1-12 0c0-4.1 6-10.8 6-10.8Z"/></svg>',

function buildDayCard(day, dayNumber, isGold){
  const theoryItems = day.theory.map(([t, text]) =>
    `<li><span class="time-tag">${t}</span>${text}</li>`).join('');
  const practiceItems = day.practice.map(t => `<li>${t}</li>`).join('');
  const individualItems = day.individual.map(t => `<li>${t}</li>`).join('');
  let exampleBlock = '';
  if (day.examples && day.examples.length) {
    const slides = day.examples.map(ex =>
      `<div class="carousel-slide"><img src="${ex.src}" alt="${day.title} 예시 이미지"><p class="cap">${ex.caption || ''}</p></div>`
    ).join('');
    const dots = day.examples.map((_, i) =>
      `<button class="cdot${i === 0 ? ' active' : ''}" data-idx="${i}" aria-label="${i + 1}번 이미지"></button>`
    ).join('');
    exampleBlock = `
      <div class="detail-block example-block">
        <h4>예시 이미지</h4>
        <div class="example-carousel">
          <div class="carousel-viewport">
            <div class="carousel-track">${slides}</div>
          </div>
          <div class="carousel-nav">
            <button class="carousel-btn prev-btn" aria-label="이전 이미지">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="carousel-dots">${dots}</div>
            <button class="carousel-btn next-btn" aria-label="다음 이미지">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </div>`;
  } else if (day.example) {
    exampleBlock = `
      <div class="detail-block example-block">
        <h4>예시 이미지</h4>
        <img src="${day.example}" alt="${day.title} 예시 이미지" loading="lazy">
        <p class="cap">${day.exampleCaption || ''}</p>
      </div>`;
  }

  const card = document.createElement('article');
  card.className = 'day-card' + (isGold ? ' gold' : '');
  card.innerHTML = `
    <div class="card-top">
      <div class="icon-circle">${ICONS[day.icon]}</div>
      <span class="badge">Day ${dayNumber}</span>
    </div>
    <h3 class="day-title">${day.title}</h3>
    <p class="day-desc">${day.desc}</p>
    <button class="toggle-btn" aria-expanded="false">
      이론·실습·개별작업 보기
      <span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
    </button>
    <div class="detail"><div>
      <div class="detail-block"><h4>이론 · 실습 (1시간 30분)</h4><ul>${theoryItems}</ul></div>
      <div class="detail-block"><h4>실습 과제</h4><ul>${practiceItems}</ul></div>
      <div class="detail-block"><h4>개별 작업 + 과제 피드백 (1시간 30분)</h4><ul>${individualItems}</ul></div>
      ${exampleBlock}
    </div></div>
  `;
  const btn = card.querySelector('.toggle-btn');
  const detail = card.querySelector('.detail');
  btn.addEventListener('click', () => {
    const open = detail.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.firstChild.textContent = open ? '접기 ' : '이론·실습·개별작업 보기 ';
  });

  // Carousel wiring (multi-image example)
  const carousel = card.querySelector('.example-carousel');
  if (carousel) {
    const track = carousel.querySelector('.carousel-track');
    const dotEls = [...carousel.querySelectorAll('.cdot')];
    const total = dotEls.length;
    let idx = 0;
    function render(){
      track.style.transform = `translateX(-${idx * 100}%)`;
      dotEls.forEach((d, i) => d.classList.toggle('active', i === idx));
    }
    carousel.querySelector('.prev-btn').addEventListener('click', () => {
      idx = (idx - 1 + total) % total;
      render();
    });
    carousel.querySelector('.next-btn').addEventListener('click', () => {
      idx = (idx + 1) % total;
      render();
    });
    dotEls.forEach(d => d.addEventListener('click', () => {
      idx = parseInt(d.dataset.idx, 10);
      render();
    }));
  }

  // Click-to-enlarge for any example image (single or carousel)
  card.querySelectorAll('.example-block img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.src));
  });

  return card;
}

// ---------- Lightbox ----------
const lightbox = document.createElement('div');
lightbox.className = 'lightbox';
lightbox.innerHTML = `<button class="lightbox-close" aria-label="닫기">✕</button><img alt="확대 이미지">`;
document.body.appendChild(lightbox);
const lightboxImg = lightbox.querySelector('img');
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
}
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox || e.target.classList.contains('lightbox-close')) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

// ---------- Navigation ----------
const dotsWrap = document.getElementById('dots');
slides.forEach((_, i) => {
  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.setAttribute('aria-label', `${i + 1}번 슬라이드로 이동`);
  dot.addEventListener('click', () => goTo(i));
  dotsWrap.appendChild(dot);
});

let current = 0;
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCount = document.getElementById('slideCount');

function render(){
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === current));
  slideCount.textContent = `${current + 1} / ${slides.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === slides.length - 1;
}

function goTo(i){
  current = Math.max(0, Math.min(slides.length - 1, i));
  render();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

document.getElementById('restartBtn').addEventListener('click', () => goTo(0));

render();
</script>
